[pytest]
testpaths = tests
pythonpath = .
# perf tests are timing checks: run them on purpose with `pytest -m perf` (a later -m overrides this one).
addopts = -ra --strict-markers -m "not perf"
# A hung test must not stall CI (a stray real LLM call once took three minutes).
timeout = 120
markers =
    postgres: needs a PostgreSQL test database (set TEST_DATABASE_URL); skipped otherwise
    perf: latency smoke tests with generous thresholds (run with: pytest -m perf)
    evaluation: agent golden-case evaluation, rule-based, scripted model (writes tests/evaluation report)
filterwarnings =
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
