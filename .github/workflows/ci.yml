name: CI

# Restores, builds and tests every part of the project on each push and pull request to main
# (and development). The gym agent service is tested twice: on SQLite (fast) and on a real PostgreSQL.

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: ASP.NET Core API (restore, build, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('BackendAPI/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore BackendAPI/VitroFit.API.Tests/VitroFit.API.Tests.csproj

      - name: Build (Release)
        run: dotnet build BackendAPI/VitroFit.API.Tests/VitroFit.API.Tests.csproj -c Release --no-restore

      - name: Test
        run: >
          dotnet test BackendAPI/VitroFit.API.Tests/VitroFit.API.Tests.csproj -c Release --no-build
          --logger "trx;LogFileName=dotnet-tests.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: TestResults/
          if-no-files-found: ignore

  gym-agent-service:
    name: Gym agent service (pytest on SQLite and PostgreSQL, evaluation, latency smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: BackendAPI/GymAgentService
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gym_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PG_TEST_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/gym_agent_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: BackendAPI/GymAgentService/requirements*.txt

      # sentence-transformers pulls in PyTorch, whose default Linux wheel is several GB of CUDA libraries.
      # Installing the CPU build first satisfies that requirement with a small wheel.
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Tests on SQLite (fast path) with coverage gate
        env:
          TEST_DATABASE_URL: ""
        run: pytest --cov --cov-report=term --junitxml=reports/junit-sqlite.xml

      - name: Tests on PostgreSQL (real database, checkpointer, migrations) with coverage gate
        env:
          TEST_DATABASE_URL: ${{ env.PG_TEST_URL }}
        run: pytest --cov --cov-report=term --cov-report=xml:reports/coverage.xml --junitxml=reports/junit-postgres.xml

      - name: Latency smoke tests (generous limits, PostgreSQL)
        env:
          TEST_DATABASE_URL: ${{ env.PG_TEST_URL }}
        run: pytest -m perf --junitxml=reports/junit-perf.xml

      - name: Latency report (quick run, for reference)
        run: >
          python -m perf.measure_latency --database-url "$PG_TEST_URL" --quick
          --sections components,database,workflows,http --out reports/perf

      - name: Show the agent evaluation report in the job summary
        if: always()
        run: |
          if [ -f reports/evaluation_report.md ]; then cat reports/evaluation_report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gym-agent-reports
          path: BackendAPI/GymAgentService/reports/
          if-no-files-found: ignore

  web:
    name: React web app (lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: VitroFit_web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: VitroFit_web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  flutter:
    name: Flutter app (analyze, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vitrofit_mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Deprecation notices (info level) do not fail the build; warnings and errors do.
      - run: flutter analyze --no-fatal-infos

      - run: flutter test

  ci-success:
    name: All checks passed
    if: always()
    needs: [dotnet, gym-agent-service, web, flutter]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi
