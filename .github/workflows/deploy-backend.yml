name: Build backend image (Azure Container Registry)

# Builds BackendAPI/Dockerfile and pushes it to Azure Container Registry. Run manually from the Actions tab.
# Needs repository secrets: ACR_LOGIN_SERVER, ACR_USERNAME, ACR_PASSWORD.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: BackendAPI
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/vitrofit-api:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/vitrofit-api:${{ github.sha }}
