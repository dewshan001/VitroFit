name: Deploy web app (Azure Static Web Apps)

# Builds VitroFit_web against the deployed API and uploads dist/ to Azure Static Web Apps. Run manually from the Actions tab.
# Needs repository secret: AZURE_STATIC_WEB_APPS_API_TOKEN
#   (az staticwebapp secrets list -g rg-vitrofit -n vitrofitdew01-web --query "properties.apiKey" -o tsv)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: VitroFit_web
    env:
      VITE_API_BASE_URL: https://vitrofitdew01-api.azurewebsites.net/api
      VITE_CHATBOT_API_URL: https://vitrofitdew01-api.azurewebsites.net/api/chat
      VITE_DIET_AGENT_API_URL: https://vitrofitdew01-api.azurewebsites.net/api/diet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: VitroFit_web/package-lock.json

      - run: npm ci
      - run: npm run build

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: VitroFit_web/dist
          skip_app_build: true
          skip_api_build: true
